[package]
name = "nop-rt-login"
version = "0.1.29"
edition = "2024"

[dependencies]
actix-web = { version = "4.12.1", features = ["rustls-0_23"] }
argon2 = "0.5"
base64 = "0.22"
log = "0.4.29"
nop-config = { path = "../nop-config" }
nop-iam-passwords = { path = "../nop-iam-passwords" }
nop-library = { path = "../nop-library" }
nop-rt-csrf = { path = "../nop-rt-csrf" }
nop-rt-headers = { path = "../nop-rt-headers" }
nop-rt-iam = { path = "../nop-rt-iam" }
nop-rt-page-cache = { path = "../nop-rt-page-cache" }
nop-rt-security = { path = "../nop-rt-security" }
nop-rt-templates = { path = "../nop-rt-templates" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1.49.0", features = ["full"] }
