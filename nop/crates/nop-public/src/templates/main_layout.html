<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {description_meta}
    <title>{title}</title>
    <link rel="stylesheet" href="{bulma_css}">
    <link rel="icon" href="{favicon_ico}">
    {theme_content}
    <style>
        .content-wrapper .content-container {
            max-width: min(var(--size-content-measure, 75ch), 100%);
        }

        .content-wrapper.is-wide .content-container {
            max-width: 1152px;
        }

        .site-page-footer {
            padding: 1rem 1.5rem 1.5rem;
            color: rgba(74, 74, 74, 0.72);
            font-size: 0.75rem;
            line-height: 1.3;
            text-align: center;
        }

        .site-page-footer a[data-site-asset-reload] {
            color: inherit;
            text-decoration: none;
        }

        .site-page-footer a[data-site-asset-reload]:hover,
        .site-page-footer a[data-site-asset-reload]:focus {
            text-decoration: underline;
        }

        .site-page-footer a[data-site-asset-reload]:focus {
            outline: 1px dotted currentColor;
            outline-offset: 2px;
        }

        @media (prefers-color-scheme: dark) {
            .site-page-footer {
                color: rgba(245, 245, 245, 0.58);
            }
        }
    </style>
</head>

<body>
    <div class="main-container" data-site-root>
        {navbar_html}
        {topbar_html}
        {menu_drawer_html}
        {structure_drawer_html}

        <div class="site-search-overlay" data-site-search-overlay hidden>
            <div class="site-search-overlay__backdrop" data-site-search-backdrop></div>
            <section class="site-search-overlay__panel" data-site-search-panel role="dialog" aria-modal="true"
                aria-label="Search">
                <header class="site-search-overlay__header">
                    <input class="site-search-overlay__input" data-site-search-input type="text" autocomplete="off"
                        spellcheck="false" placeholder="Search..." aria-label="Search query" maxlength="256">
                    <button class="site-search-overlay__close" type="button" data-site-search-close
                        aria-label="Close search">Close</button>
                </header>
                <div class="site-search-overlay__status" data-site-search-status aria-live="polite"></div>
                <div class="site-search-overlay__results" data-site-search-results></div>
            </section>
        </div>

        <div class="{doc_layout_class}">
        {doc_structure_html}
            {content}
        </div>
        {page_footer}
    </div>

    <script src="{site_js}" defer></script>
</body>

</html>
