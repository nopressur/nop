<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title}</title>
    <link rel="stylesheet" href="{bulma_css}">
    <link rel="icon" href="{favicon_ico}">
    {theme_content}
    <style>
        .content-wrapper .content-container {
            max-width: 960px;
        }

        .content-wrapper.is-wide .content-container {
            max-width: 1152px;
        }
    </style>
</head>

<body>
    <div class="main-container" data-site-root>
        <nav class="navbar" role="navigation" aria-label="main navigation" data-site-navbar>
            <div class="container">
                <div class="navbar-brand">
                    <a class="navbar-item" href="/">
                        <strong>{app_name}</strong>
                    </a>

                    <button class="navbar-item site-search-trigger site-search-trigger--mobile" type="button"
                        data-site-search-button aria-label="Search" title="Search">
                        <svg viewBox="0 0 310.42 310.42" aria-hidden="true">
                            <g>
                                <path
                                    d="M273.587,214.965c49.11-49.111,49.109-129.021,0-178.132c-49.111-49.111-129.02-49.111-178.13,0 C53.793,78.497,47.483,140.462,76.51,188.85c0,0,2.085,3.498-0.731,6.312c-16.065,16.064-64.263,64.263-64.263,64.263 c-12.791,12.79-15.836,30.675-4.493,42.02l1.953,1.951c11.343,11.345,29.229,8.301,42.019-4.49c0,0,48.096-48.097,64.128-64.128 c2.951-2.951,6.448-0.866,6.448-0.866C169.958,262.938,231.923,256.629,273.587,214.965z M118.711,191.71 c-36.288-36.288-36.287-95.332,0.001-131.62c36.288-36.287,95.332-36.288,131.619,0c36.288,36.287,36.288,95.332,0,131.62 C214.043,227.996,155,227.996,118.711,191.71z" />
                                <path
                                    d="M126.75,118.424c-1.689,0-3.406-0.332-5.061-1.031c-6.611-2.798-9.704-10.426-6.906-17.038 c17.586-41.559,65.703-61.062,107.261-43.476c6.611,2.798,9.704,10.426,6.906,17.038c-2.799,6.612-10.425,9.703-17.039,6.906 c-28.354-11.998-61.186,1.309-73.183,29.663C136.629,115.445,131.815,118.424,126.75,118.424z" />
                            </g>
                        </svg>
                    </button>

                    <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false"
                        data-site-mobile-toggle>
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                    </a>
                </div>

                <div class="navbar-menu" data-site-mobile-menu>
                    <div class="navbar-start">
                        {nav_html}
                    </div>
                    <div class="navbar-end" data-site-content-id="{content_id}">
                        <button class="navbar-item site-search-trigger site-search-trigger--desktop" type="button"
                            data-site-search-button aria-label="Search" title="Search">
                            <svg viewBox="0 0 310.42 310.42" aria-hidden="true">
                                <g>
                                    <path
                                        d="M273.587,214.965c49.11-49.111,49.109-129.021,0-178.132c-49.111-49.111-129.02-49.111-178.13,0 C53.793,78.497,47.483,140.462,76.51,188.85c0,0,2.085,3.498-0.731,6.312c-16.065,16.064-64.263,64.263-64.263,64.263 c-12.791,12.79-15.836,30.675-4.493,42.02l1.953,1.951c11.343,11.345,29.229,8.301,42.019-4.49c0,0,48.096-48.097,64.128-64.128 c2.951-2.951,6.448-0.866,6.448-0.866C169.958,262.938,231.923,256.629,273.587,214.965z M118.711,191.71 c-36.288-36.288-36.287-95.332,0.001-131.62c36.288-36.287,95.332-36.288,131.619,0c36.288,36.287,36.288,95.332,0,131.62 C214.043,227.996,155,227.996,118.711,191.71z" />
                                    <path
                                        d="M126.75,118.424c-1.689,0-3.406-0.332-5.061-1.031c-6.611-2.798-9.704-10.426-6.906-17.038 c17.586-41.559,65.703-61.062,107.261-43.476c6.611,2.798,9.704,10.426,6.906,17.038c-2.799,6.612-10.425,9.703-17.039,6.906 c-28.354-11.998-61.186,1.309-73.183,29.663C136.629,115.445,131.815,118.424,126.75,118.424z" />
                                </g>
                            </svg>
                        </button>
                        {user_nav_html}
                    </div>
                </div>
            </div>
        </nav>

        <div class="site-search-overlay" data-site-search-overlay hidden>
            <div class="site-search-overlay__backdrop" data-site-search-backdrop></div>
            <section class="site-search-overlay__panel" data-site-search-panel role="dialog" aria-modal="true"
                aria-label="Search">
                <header class="site-search-overlay__header">
                    <input class="site-search-overlay__input" data-site-search-input type="text" autocomplete="off"
                        spellcheck="false" placeholder="Search..." aria-label="Search query" maxlength="256">
                    <button class="site-search-overlay__close" type="button" data-site-search-close
                        aria-label="Close search">Close</button>
                </header>
                <div class="site-search-overlay__status" data-site-search-status aria-live="polite"></div>
                <div class="site-search-overlay__results" data-site-search-results></div>
            </section>
        </div>

        <div class="{content_wrapper_class}" data-compact="{content_compact}"
            data-short-paragraph-length="{short_paragraph_length}" data-site-close-dropdowns>
            <div class="container content-container" style="{content_container_style}">
                <div class="content">
                    {content}
                </div>
            </div>
        </div>
    </div>

    <script src="{site_js}" defer></script>
</body>

</html>
