[package]
name = "nop-public"
version = "0.1.29"
edition = "2024"

[dependencies]
actix-web = { version = "4.12.1", features = ["rustls-0_23"] }
ammonia = "4.1.2"
chrono = { version = "0.4.43", features = ["serde"] }
getrandom = "0.4.2"
log = "0.4.29"
md5 = "0.8.0"
minijinja = { version = "2.15.1", features = ["macros", "custom_syntax", "loader", "builtins", "preserve_order", "debug", "urlencode", "json"] }
nom = "8.0.0"
nop-config = { path = "../nop-config" }
nop-content-store = { path = "../nop-content-store" }
nop-rt-headers = { path = "../nop-rt-headers" }
nop-rt-iam = { path = "../nop-rt-iam" }
nop-rt-page-cache = { path = "../nop-rt-page-cache" }
nop-rt-paths = { path = "../nop-rt-paths" }
nop-rt-release = { path = "../nop-rt-release" }
nop-rt-security = { path = "../nop-rt-security" }
nop-rt-templates = { path = "../nop-rt-templates" }
once_cell = "1.0"
pulldown-cmark = "0.13.0"
regex = "1.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
urlencoding = "2.1"

[dev-dependencies]
nop-config = { path = "../nop-config", features = ["test-helpers"] }
uuid = { version = "1.20.0", features = ["v4"] }
